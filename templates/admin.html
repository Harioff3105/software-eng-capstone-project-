<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScholarAI | Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">🎓 ScholarAI Admin</span><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></nav>
<main class="container py-4"><div id="message" class="alert d-none"></div><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Administration Dashboard</h1><p class="text-muted mb-0">Manage scholarship schemes, review applications and monitor platform performance.</p></div><a class="btn btn-success" href="/api/reports/applications.csv">Export Applications CSV</a></div>
<div id="metrics" class="row g-3 mb-4"></div>
<div class="row g-4"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-body"><h4>Add Scholarship</h4><input id="title" class="form-control mb-2" placeholder="Scholarship title"><input id="provider" class="form-control mb-2" placeholder="Provider"><textarea id="description" class="form-control mb-2" placeholder="Description"></textarea><div class="row g-2"><div class="col-6"><input id="amount" class="form-control" type="number" placeholder="Amount"></div><div class="col-6"><input id="deadline" class="form-control" type="date"></div><div class="col-6"><input id="min_cgpa" class="form-control" type="number" step="0.01" placeholder="Min CGPA"></div><div class="col-6"><input id="max_income" class="form-control" type="number" placeholder="Max income"></div></div><input id="eligible_category" class="form-control my-2" placeholder="Eligible category"><input id="eligible_courses" class="form-control mb-2" placeholder="Eligible courses"><input id="tags" class="form-control mb-3" placeholder="Tags"><button class="btn btn-primary w-100" onclick="createScholarship()">Create Scholarship</button></div></div><div class="card shadow-sm mt-4"><div class="card-body"><h4>Scholarship Management</h4><div id="scholarships"></div></div></div></div>
<div class="col-lg-7"><div class="card shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><h4>Application Review</h4><button class="btn btn-outline-primary btn-sm" onclick="loadAll()">Refresh</button></div><div class="table-responsive mt-3"><table class="table align-middle"><thead><tr><th>Student</th><th>Scholarship</th><th>AI</th><th>Status</th><th>Action</th></tr></thead><tbody id="applications"></tbody></table></div></div></div><div class="card shadow-sm mt-4"><div class="card-body"><h4>Analytics</h4><div id="analytics" class="row g-3"></div></div></div></div></div></main><script src="{{ url_for('static', filename='js/admin.js') }}"></script></body></html>
