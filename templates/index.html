<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScholarAI | Scholarship Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand fw-bold">🎓 ScholarAI</span><span class="text-white">AI-Based Scholarship Eligibility & Application Management</span></div></nav>
<main class="container py-5">
  <div class="hero p-4 p-md-5 mb-4 rounded-4 shadow-sm bg-white"><h1 class="display-6 fw-bold">Find scholarships that fit your future.</h1><p class="lead">Register, discover schemes, verify eligibility with AI, apply and track every application.</p><div class="d-flex gap-2 flex-wrap"><a href="#auth" class="btn btn-primary">Get Started</a><a href="#scholarships" class="btn btn-outline-primary">Browse Scholarships</a></div></div>
  <div class="row g-4" id="auth">
    <div class="col-lg-5"><div class="card shadow-sm h-100"><div class="card-body"><h3>Student Account</h3><div id="message" class="alert d-none"></div><input id="name" class="form-control mb-2" placeholder="Full name"><input id="email" class="form-control mb-2" type="email" placeholder="Email"><input id="password" class="form-control mb-3" type="password" placeholder="Password"><div class="d-flex gap-2"><button class="btn btn-primary" onclick="register()">Register</button><button class="btn btn-outline-secondary" onclick="login()">Login</button></div></div></div></div>
    <div class="col-lg-7" id="scholarships"><div class="card shadow-sm"><div class="card-body"><div class="d-flex justify-content-between align-items-center gap-2"><h3>Scholarship Schemes</h3><div class="input-group" style="max-width:320px"><input id="q" class="form-control" placeholder="Search"><button class="btn btn-primary" onclick="loadScholarships()">Search</button></div></div><div id="list" class="mt-3"></div></div></div></div>
  </div>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
